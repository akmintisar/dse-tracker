<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Search and track stocks listed on the Dhaka Stock Exchange (DSE).">
<title>DSE Tracker — Bangladesh Stock Market</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div>
    <h1>DSE Tracker</h1>
    <p class="subtitle">Bangladesh stock market</p>
  </div>
  <span class="badge" id="status-badge">Loading…</span>
</header>

<div class="search">
  <label for="search-input" class="sr-only">Search DSE stocks</label>
  <input type="search" id="search-input" autocomplete="off" placeholder="Search ticker or company (e.g. GP, SQURPHARMA)" />
  <div id="search-results" class="search-results" role="listbox"></div>
</div>

<div class="container">
  <div class="updated" id="last-updated"></div>

  <div class="price-card">
    <div class="price-top">
      <div>
        <div class="ticker" id="stock-ticker">—</div>
        <div class="price" id="stock-price">—</div>
        <div class="change" id="stock-change">—</div>
      </div>
      <div class="range-tabs" aria-label="Chart range">
        <button data-range="1D">1D</button>
        <button data-range="1W" class="active">1W</button>
        <button data-range="1M">1M</button>
        <button data-range="1Y">1Y</button>
      </div>
    </div>

    <div class="chart-wrap">
      <svg id="chart-svg" viewBox="0 0 600 180" preserveAspectRatio="none" aria-label="Stock price chart">
        <polyline id="chart-line" fill="none" stroke="#3ecf8e" stroke-width="2" points="" />
        <polyline fill="none" stroke="#22262c" stroke-width="1" points="0,150 600,150" />
      </svg>
      <div id="chart-empty" class="chart-empty" hidden>Historical price data is not available yet.</div>
    </div>
  </div>

  <div class="stats-grid" id="stats-grid"></div>

  <div class="future">
    <b>More DSE data is coming</b>
    Historical charts, DSEX/DS30 market indices, gainers/losers, sector data, watchlists, and alerts will be added incrementally.
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
