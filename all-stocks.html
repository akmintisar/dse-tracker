<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Dhumketu Express — complete Bangladesh stock market list and filters.">
<title>All Stocks — Dhumketu Express</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <a class="brand-home" href="index.html"><h1>Dhumketu Express</h1></a>
    <p class="subtitle">Dhaka Stock Exchange · Bangladesh</p>
  </div>
  <nav class="main-nav" aria-label="Main navigation">
    <a class="active" href="all-stocks.html">All Stocks</a>
    <a href="insights.html">Insights</a>
    <a href="news.html">News</a>
    <a href="#blog">Blog</a>
    <a href="https://akmintisar.github.io/dse-tracker/about.html">About</a>
  </nav>
  <span class="badge" id="status-badge">Loading…</span>
</header>
<div class="search-shell">
  <div class="search">
    <label class="sr-only" for="search-input">Search DSE stocks</label>
    <div class="search-box">
      <span class="search-icon">⌕</span>
      <input id="search-input" type="search" autocomplete="off" placeholder="Search by ticker or company name…" />
    </div>
    <div id="search-results" role="listbox"></div>
  </div>
</div>
<main class="container">
  <div class="updated" id="last-updated"></div>
  <section id="all-stocks">
    <div class="section-title">
      <div>
        <h2>All Stocks</h2>
        <p>Complete DSE stock catalog with filters and sorting.</p>
      </div>
    </div>
    <div class="stock-filters">
      <label><span>Category</span><select id="category-filter">
        <option value="all">All categories</option><option value="A">A</option><option value="B">B</option><option value="G">G</option><option value="N">N</option><option value="Z">Z</option>
      </select></label>
      <label><span>Trading status</span><select id="status-filter">
        <option value="all">All stocks</option><option value="traded">Currently priced</option><option value="no-price">No current price</option>
      </select></label>
      <label><span>Sort by</span><select id="sort-filter">
        <option value="ticker">Ticker</option><option value="company">Company</option><option value="price-desc">Price: High to Low</option><option value="price-asc">Price: Low to High</option><option value="change-desc">Change: High to Low</option><option value="change-asc">Change: Low to High</option><option value="volume-desc">Volume: High to Low</option>
      </select></label>
      <div class="stock-count" id="stock-count"></div>
    </div>
    <div class="all-stocks-table">
      <div class="all-stocks-head"><span>Stock</span><span>Category</span><span>Price</span><span>Change</span><span>Volume</span></div>
      <div id="all-stocks-list"></div>
    </div>
  </section>
</main>
<script src="all-stocks.js"></script>
</body>
</html>
