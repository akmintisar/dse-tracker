name: Update DSE data

on:
  schedule:
    # GitHub Actions cron is UTC.
    - cron: "*/30 4-8 * * 0-4"
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Update complete DSE stock catalog and current prices
        run: python scripts/scrape.py

      - name: Update historical chart data
        run: python scripts/update_history.py

      - name: Commit all DSE data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history
          git diff --staged --quiet || git commit -m "Update DSE market data"
          git pull --rebase origin main
          git push
