name: Update DSE data

on:
  schedule:
    # Daily maintenance after the DSE trading session.
    - cron: "15 21 * * 0-4"
      timezone: "Asia/Dhaka"
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

# Prevent overlapping runs from generating and pushing competing snapshots.
concurrency:
  group: update-dse-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Update complete DSE stock catalog and current prices
        run: python scripts/scrape.py

      - name: Update historical chart data
        run: python scripts/update_history.py

      - name: Generate indexable stock pages and sitemap
        run: python scripts/generate_stock_pages.py

      - name: Commit all DSE data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage every output produced by the data and page-generation steps.
          # The page generator updates stock/<ticker>/index.html and sitemap.xml.
          git add -A -- data/latest.json data/history stock sitemap.xml

          if ! git diff --cached --quiet; then
            git commit -m "Update DSE market data"
          fi

          # Rebase only after generated changes are committed, so the worktree is clean.
          git pull --rebase origin main
          git push
